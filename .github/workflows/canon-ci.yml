name: canon-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canon-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canon (objects/ parse + schema + reference checks)
        run: npm run validate

      - name: Run .canon test suite
        run: npm test

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python syntax check (scripts/)
        run: python -m py_compile scripts/*.py

      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact -v
