        - 'generic "rule: BR-001 Subscriptions are owned by the Vendor. The Vendor Extension creates and maintains Subscriptions as the authoritative fulfilment record. SoftwareOne (Operations) owns the [[Agreement]]; the Vendor owns the Subscriptions under it." [ref=e1990]'
        - 'generic "rule: BR-002 A Subscription is normally created during [[Order]] Processing as an OrderSubscription and promoted to a live Subscription when the Purchase or Change [[Order]] completes. The platform copies the OrderSubscription to create the live Subscription, retaining the same ID. The Subscription is created directly in Active status — there is no Draft state." [ref=e1991]'
        - 'generic "rule: BR-003 When a Termination [[Order]] completes, the affected Subscriptions transition to Terminated. When a Vendor terminates a Subscription directly via the `/terminate` endpoint, the Subscription transitions immediately to Terminated. In both cases, `terminationDate` is set automatically by the platform." [ref=e1992]'
        - 'generic "rule: BR-004 Expired and Terminated are permanently terminal states. A Subscription cannot be reactivated from either state. A new Subscription must be created — typically via a new Purchase or Change [[Order]] — to replace a terminated or expired Subscription." [ref=e1993]'
        - 'generic "rule: BR-005 The platform runs a daily renewal service that evaluates all Active Subscriptions. For Subscriptions where `autoRenew = true` and `commitmentDate < today`: the `renewed` audit event is recorded and `commitmentDate` is updated to `commitmentDate + terms.period`. The Subscription status does not change." [ref=e1994]'
        - 'generic "rule: BR-006 The platform runs a daily renewal service that evaluates all Active Subscriptions. For Subscriptions where `autoRenew = false` and `commitmentDate < today`: the Subscription transitions to Expired. `commitmentDate` is not updated. Expired is a terminal state." [ref=e1995]'
        - 'generic "rule: BR-007 The `autoRenew` flag can only be updated directly by the Vendor. The Client cannot update `autoRenew` directly — it may be toggled via a Configuration [[Order]], which the Vendor Extension processes." [ref=e1996]'
        - 'generic "rule: BR-008 Subscription-scoped `parameters.fulfillment` are written and maintained exclusively by the Vendor. The Client cannot update Subscription parameters directly." [ref=e1997]'
        - 'generic "rule: BR-009 The `terms` object on a Subscription (`model`, `period`, `commitment`) is set at Subscription creation and is immutable thereafter. The terms of all Lines under a Subscription must match the terms of the Subscription." [ref=e1998]'
        - 'generic "rule: BR-010 There is no DELETE endpoint on Subscription. The only paths to terminal states are Termination (via Termination [[Order]] or direct Vendor action) and Expiry (via the platform''s daily renewal service)." [ref=e1999]'
        - 'generic "rule: BR-011 The `name` field on a Subscription can be updated by any Actor." [ref=e2000]'
        - 'generic "rule: BR-012 The `template` field on a Subscription can be set and updated by the Vendor in any non-terminal status. The template is absent from the Subscription response when null — consistent with null suppression." [ref=e2001]'
        - 'generic "rule: BR-013 Operations can update `price.defaultMarkup` and `price.defaultMargin` directly on a Subscription, and can manage Split Billing via the `/split` endpoint. Operations can also manage markup on Subscription Lines. These are the only direct update capabilities available to the Operations Actor on a Subscription." [ref=e2002]'
        - 'generic "rule: BR-014 The `split` field and `splitStatus` field are suppressed from Vendor API responses — visible to Client and Operations only. See AGR-007 for Split Billing canon — pending canonisation." [ref=e2003]'
        - 'generic "rule: BR-015 Subscription pricing field visibility mirrors the [[Agreement]] and [[Order]] pricing model: `PPxY` and `PPxM` are visible to Vendor and Operations; `SPxY` and `SPxM` are visible to Client and Operations; `markup`, `margin`, `defaultMarkup`, `defaultMargin`, `defaultMarkupSource`, and `markupSource` are visible to Operations only." [ref=e2004]'
        - 'generic "rule: BR-016 The `commitmentDate` field represents the date by which the Subscription must be renewed or it will expire. It is evaluated daily by the platform''s renewal service. After a successful renewal, it is updated to `commitmentDate + terms.period`." [ref=e2005]'
        - 'generic "rule: BR-017 Subscription visibility is self-scoped per Actor: Vendor sees only Subscriptions on Agreements where they are the Vendor; Client sees only Subscriptions on Agreements belonging to their own [[Account]]; Operations sees all Subscriptions platform-wide." [ref=e2006]'
