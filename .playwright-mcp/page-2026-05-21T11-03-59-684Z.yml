        - 'generic "rule: BR-001 A Parameter belongs to exactly one [[Product]] and cannot be shared across Products." [ref=e1636]'
        - 'generic "rule: BR-002 A Parameter has a scope. Valid scopes are: [[Agreement]], [[Asset]], [[Item]], [[Order]], Request, [[Subscription]]. Scope determines which platform object type the Parameter is associated with. Note: Request scope is deprecated and pending removal in v5." [ref=e1637]'
        - 'generic "rule: BR-002a The context property is applicable to [[Order]]-scoped Parameters only. It defines the type of [[Order]] the Parameter is designed for. Valid values are: Purchase, Change, Configuration, Termination, None. A value of None indicates the Parameter applies to all [[Order]] types. For all other scopes, context is None." [ref=e1638]'
        - 'generic "rule: BR-003 A Parameter has a phase. Valid phases are: Configuration, [[Order]], Fulfillment. Phase determines when in the lifecycle the parameter is relevant. Configuration phase is used for Orders of type Configuration." [ref=e1639]'
        - 'generic "rule: BR-004 Only [[Agreement]]-scoped and [[Order]]-scoped Parameters can use the [[Order]] or Configuration phase. [[Asset]], [[Item]], and [[Subscription]]-scoped Parameters are Fulfillment phase only." [ref=e1640]'
        - 'generic "rule: BR-005 A Parameter may belong to a [[Parameter Group]]. If no group is specified on creation, the Parameter is automatically assigned to the Default [[Parameter Group]]." [ref=e1641]'
        - 'generic "rule: BR-006 A Parameter has a type that determines the shape of its value and how it is rendered in the UI. Valid types are: SingleLineText, MultiLineText, Choice, DropDown, Checkbox, Address, Contact, Email, Date, DataObject, Subdomain, Heading. DropDown is similar to Choice but its options have no description property. Subdomain collects a subdomain string value; the platform validates that it does not contain a dot (.). Heading is a presentational type only — it carries no value and is used to structure the UI. In a future version, Heading will support a markdown/html value field updatable by an Extension." [ref=e1642]'
        - 'generic "rule: BR-007 A Parameter has a multiple flag. When true, multiple values can be associated with a single parameter instance." [ref=e1643]'
        - 'generic "rule: BR-008 A Parameter has an externalId — a Vendor-defined identifier used to reference the parameter in integrations and Extensions." [ref=e1644]'
        - 'generic "rule: BR-009 Parameter creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1645]'
        - 'generic "rule: BR-010 Parameters are soft-deleted only. Soft-deleted Parameters remain retrievable in some contexts (e.g. [[Template]] substitution rendering) but are no longer visible in normal API listing responses." [ref=e1646]'
        - 'generic "rule: BR-011 When a Parameter is soft-deleted, its values on all live objects (Orders, Agreements, Assets, Subscriptions) are preserved and remain resolvable. Templates referencing soft-deleted Parameters via substitution tokens continue to render correctly." [ref=e1647]'
        - 'generic "rule: BR-012 Parameters have constraints that control visibility and editability. Available constraints differ by scope: [[Agreement]] and [[Order]] scoped parameters support required, hidden, and readonly. [[Asset]] and [[Subscription]] scoped parameters support required only. [[Item]]-scoped parameters support required only." [ref=e1648]'
        - 'generic "rule: BR-013 Constraints operate at two layers: definition-level and instance-level. Definition-level constraints are set on the Parameter definition and serve as the default applied when a new object instance is created. Instance-level constraints are set by the Vendor Extension on a specific live object and override the definition-level constraints for that instance. Instance-level always wins." [ref=e1649]'
        - 'generic "rule: BR-014 The Vendor Extension can modify instance-level constraints on any live object type ([[Order]], [[Agreement]], [[Asset]], [[Subscription]]) independently of the Parameter definition." [ref=e1650]'
        - 'generic "rule: BR-015 Definition-level constraints are a default template, not a contract. Once a live object instance exists, the definition-level constraints are irrelevant to that instance. Definition-level constraints only apply at the moment a new instance is created and the defaults are first applied." [ref=e1651]'
        - 'generic "rule: BR-016 [[Agreement]]-scoped and [[Order]]-scoped, [[Order]]-phase parameter values are collected from the Client when an [[Order]] is being created ([[Order]] in Draft state)." [ref=e1652]'
        - 'generic "rule: BR-017 A Client can edit [[Agreement]]-scoped and [[Order]]-scoped parameter values while an [[Order]] is in Draft or Querying state. Querying state exists specifically to allow the Client to correct invalid parameter values." [ref=e1653]'
        - 'generic "rule: BR-018 Fulfillment-phase parameter values are written by the Vendor (via Extension). Clients cannot write Fulfillment-phase parameter values. Operations may edit Fulfillment-phase parameter values in exceptional circumstances." [ref=e1654]'
        - 'generic "rule: BR-019 [[Asset]]-scoped and [[Subscription]]-scoped parameter values are exclusively written by the Vendor during fulfillment. Clients cannot write these values." [ref=e1655]'
        - 'generic "rule: BR-020 When an [[Order]] reaches Completed state, [[Agreement]]-scoped, [[Order]]-phase parameter values are copied to the resulting [[Agreement]]. The copy is a value snapshot — it includes both the parameter values and the instance-level constraints as they existed on the [[Order]] at the time of completion. This is not a reference to the Parameter definition. If the Vendor Extension has modified instance-level constraints on the [[Order]] prior to completion, those modified constraints are what is copied — not the definition defaults." [ref=e1656]'
        - 'generic "rule: BR-021 After an [[Order]] reaches Completed state and the [[Agreement]] becomes Active, the Vendor can continue to modify instance-level constraints on [[Agreement]] parameter instances at any time. This is independent of the Parameter definition." [ref=e1657]'
        - 'generic "rule: BR-022 [[Item]]-scoped Parameters store Vendor-defined metadata about a [[Product]] [[Item]]. They are surfaced in the Items list during the ordering UI and are filterable. A common use case is a \"[[Product]] Family\" parameter (e.g. values: \"Document Cloud\", \"Creative Cloud\") that allows Clients to filter Items by family during ordering. The only constraint available for [[Item]]-scoped Parameters is required." [ref=e1658]'
