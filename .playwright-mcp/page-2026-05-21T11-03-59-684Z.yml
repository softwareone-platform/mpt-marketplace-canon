        - 'generic "rule: BR-001 A Terms object belongs to exactly one [[Product]] and cannot be shared across Products." [ref=e1741]'
        - 'generic "rule: BR-002 A [[Product]] may have multiple Terms objects. All Published Terms on a [[Product]] are presented to the Client during [[Order]] creation." [ref=e1742]'
        - 'generic "rule: BR-003 Terms are presented to the Client in ascending displayOrder sequence during [[Order]] creation." [ref=e1743]'
        - 'generic "rule: BR-004 A Client must accept all Published Terms on a [[Product]] before an [[Order]] can be submitted." [ref=e1744]'
        - 'generic "rule: BR-005 Acceptance is recorded at the Terms level, not the Variant level. The acceptance record captures the Terms ID, timestamp, and the Actor token of the accepting party." [ref=e1745]'
        - 'generic "rule: BR-006 Only Published Variants are shown to the Client when Terms are presented for acceptance. A Published Terms object with no Published Variants is valid platform state — the Client will see the Terms entry but have no content to read. The Vendor is responsible for ensuring at least one Published Variant exists before a Client encounters the Terms." [ref=e1746]'
        - 'generic "rule: BR-007 Terms and their Variants have fully independent state machines. There is no state dependency or cascade in either direction — publishing or unpublishing a Terms object does not affect its Variants, and vice versa." [ref=e1747]'
        - 'generic "rule: BR-008 Terms creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1748]'
        - 'generic "rule: BR-009 Only Draft Terms may be deleted by the Vendor. Published, Pending, and Unpublished Terms cannot be deleted." [ref=e1749]'
        - 'generic "rule: BR-009a A Terms object cannot be deleted while it has any child Variants, regardless of Variant state. All Variants must be deleted independently before the Terms can be deleted. The platform does not cascade deletions." [ref=e1750]'
