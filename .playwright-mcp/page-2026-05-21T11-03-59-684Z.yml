        - 'generic "rule: BR-001 An Account''s `type` is immutable after creation. The `type` field determines the Actor permission profile for all Users and API Tokens associated with the Account and cannot be changed once set." [ref=e1340]'
        - 'generic "rule: BR-002 In PROD, there is exactly one Operations Account. It represents SoftwareOne as the platform steward and cannot be duplicated." [ref=e1341]'
        - 'generic "rule: BR-003 In PROD, there is exactly one Account per Vendor entity. One real-world software manufacturer maps to one Vendor Account." [ref=e1342]'
        - 'generic "rule: BR-004 A Client Account has a 1:1 relationship with a CDG (Customer Discount Group) in SoftwareOne''s ERP. The CDG is the global identifier for a customer organisation. The CDG is represented on the Client Account via the `externalId` field. The relationship is 1:1 but a Client Account may have a null CDG — `externalId` is nullable." [ref=e1343]'
        - 'generic "rule: BR-005 An Account cannot be deleted. No DELETE endpoint exists in the API spec." [ref=e1344]'
        - 'generic "rule: BR-006 Every Account has at least one User Group. The Default Protection Pattern applies — exactly one group must be marked `isDefault: true` at all times. The default group cannot be deleted directly; it must first be demoted. Marking a new group as default automatically demotes the existing default." [ref=e1345]'
        - 'generic "rule: BR-007 The `eligibility` field is applicable to Client Accounts only. It controls whether the Client may transact as a standard Client (`eligibility.client`) and/or as a Partner (`eligibility.partner`). For Vendor and Operations Accounts, `eligibility` is absent from the API response (null suppression)." [ref=e1346]'
        - 'generic "rule: BR-008 The `externalIds.pyraTenantId` field is a UUID that maps the Account to SoftwareOne''s internal identity platform (Pyra). It is present on all Account types." [ref=e1347]'
        - 'generic "rule: BR-009 The `externalId` field is Operations-managed on all Account types. On Vendor Accounts, it maps to the manufacturer code in SoftwareOne''s ERP. On Client Accounts, it maps to the CDG (Customer Discount Group) — the global ERP identifier for a customer organisation. On the Operations Account, `externalId` is present in the spec but has no defined operational purpose. `externalId` is always set and maintained exclusively by Operations — no other Actor can write this field." [ref=e1348]'
        - 'generic "rule: BR-010 The `name` field has a minimum length of 1 and a maximum length of 500 characters. It is required on creation and on update." [ref=e1349]'
        - 'generic "rule: BR-011 `technicalSupportEmail` has a maximum length of 320 characters and must be a valid email format. It is optional. Observed on Operations and Vendor Accounts; absent from the Client Account in the data sample." [ref=e1350]'
        - 'generic "rule: BR-012 `website` and `description` each have a maximum length of 2,000 characters. Both are optional. Observed on Operations and Vendor Accounts; absent from the Client Account in the data sample." [ref=e1351]'
        - 'generic "rule: BR-013 `groups` and `audit` are omitted from Account API responses by default. Both must be explicitly requested via `select=+groups` and `select=+audit` respectively." [ref=e1352]'
        - 'generic "rule: BR-014 The `address` field is an object on all Account types. An empty address object (`{}`) is a valid representation — all address sub-fields are nullable." [ref=e1353]'
