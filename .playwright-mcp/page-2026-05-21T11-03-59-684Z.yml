        - 'generic "rule: BR-002 A Price List is scoped to exactly one currency (ISO 4217). Multiple Price Lists for the same currency may exist under a single [[Product]]." [ref=e1495]'
        - 'generic "rule: BR-003 When a Price List is created, a [[Price List Item]] is automatically created for every [[Item]] currently in the [[Product]]. All Price List Items are created in Draft status." [ref=e1496]'
        - 'generic "rule: BR-004 A Price List may be referenced by one or more Listings. The same Price List may appear in multiple Listings." [ref=e1497]'
        - 'generic "rule: BR-005 A Price List cannot be deleted while it is referenced by any [[Listing]]. All Listings referencing the Price List must be deleted before the Price List can be deleted." [ref=e1498]'
        - 'generic "rule: BR-006 defaultMarkup serves two roles. First, it is a billing fallback applied to a Billing: Charge during reconciliation when the Charge cannot be reconciled against a Commerce: [[Subscription]] or Commerce: [[Agreement]] (reconciliation chain: [[Subscription]] → [[Agreement]] → Price List). Second, when a [[Price List Item]]''s unitLP is not supported, the platform applies defaultMarkup as the markup for that item rather than computing markup from unitLP." [ref=e1499]'
        - 'generic "rule: BR-007 defaultMargin is computed from defaultMarkup and is never stored." [ref=e1500]'
        - 'generic "rule: BR-008 defaultMarkup, defaultMargin, and all margin and sales pricing statistics are not present in API responses when using a Vendor or Client token. These fields are visible to Operations only." [ref=e1501]'
