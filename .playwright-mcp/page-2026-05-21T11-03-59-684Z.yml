        - 'generic "rule: BR-001 A [[Parameter]] Group belongs to exactly one [[Product]] and cannot be shared across Products." [ref=e1667]'
        - 'generic "rule: BR-002 Exactly one [[Parameter]] Group per [[Product]] must be marked as Default." [ref=e1668]'
        - 'generic "rule: BR-003 If a new [[Parameter]] is created without specifying a [[Parameter]] Group, it is automatically assigned to the Default [[Parameter]] Group." [ref=e1669]'
        - 'generic "rule: BR-004 The `displayOrder` attribute controls the sequence in which [[Parameter]] Groups are presented during the ordering and configuration process." [ref=e1670]'
        - 'generic "rule: BR-005 [[Parameter]] Group creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1671]'
        - 'generic "rule: BR-006 The Default [[Parameter]] Group cannot be deleted. To delete a Default [[Parameter]] Group, the Vendor must first designate another [[Parameter]] Group as Default." [ref=e1672]'
        - 'generic "rule: BR-007 A [[Parameter]] Group cannot be deleted if it contains Parameters. All Parameters must be removed or reassigned before the group can be deleted." [ref=e1673]'
        - 'generic "entity: Template" [ref=e1674]'
