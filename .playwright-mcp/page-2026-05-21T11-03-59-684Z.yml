        - 'generic "rule: BR-001 [[Template]] creation, modification, and deletion under a Product are not restricted by the state of the Product." [ref=e1775]'
        - 'generic "rule: BR-002 Products cannot be deleted in any state." [ref=e1776]'
        - 'generic "rule: BR-003 Once a Product is submitted to Pending, the Vendor cannot withdraw it. The only exit from Pending is publication by Operations." [ref=e1777]'
        - 'generic "rule: BR-004 A Product in Pending state cannot be returned to Draft." [ref=e1778]'
        - 'generic "rule: BR-005 All Product attributes are mutable in all states, including Published." [ref=e1779]'
        - 'generic "rule: BR-006 When a Product is Unpublished, it is no longer visible to Clients for new purchases." [ref=e1780]'
        - 'generic "rule: BR-007 When a Product is Unpublished, Clients with existing Agreements for that Product retain full transactional access." [ref=e1781]'
        - 'generic "rule: BR-008 A Product can cycle between Published and Unpublished states without limit." [ref=e1782]'
        - 'generic "rule: BR-009 Unpublished is not a terminal state. An Unpublished Product cannot be deleted — no Product can be deleted." [ref=e1783]'
