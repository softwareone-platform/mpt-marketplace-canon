        - 'generic "rule: BR-001 A Webhook belongs to exactly one [[Account]]. The owning [[Account]] determines which Actor controls it." [ref=e2022]'
        - 'generic "rule: BR-002 A Webhook is created in Enabled state by default." [ref=e2023]'
        - 'generic "rule: BR-003 A Webhook has a type that determines which platform event triggers it. Valid types are extensible as new object types and states are added to the platform." [ref=e2024]'
        - 'generic "rule: BR-004 A Webhook has an objectType that determines which platform object type it listens to." [ref=e2025]'
        - 'generic "rule: BR-005 A Webhook may have a criteria block containing any valid RQL expression, provided the expression is executable against the specified objectType." [ref=e2026]'
        - 'generic "rule: BR-006 When a Webhook fires, the platform makes an HTTP call to the configured URL. The owning Actor''s Extension is responsible for handling the call." [ref=e2027]'
        - 'generic "rule: BR-007 The platform does not auto-disable a Webhook based on failure thresholds. The failuresSinceLastSuccess statistic is purely informational." [ref=e2028]'
        - 'generic "rule: BR-008 When a Webhook is Disabled, events that would have triggered it are not queued. Missed events are lost." [ref=e2029]'
        - 'generic "rule: BR-009 Deletion is a soft delete. Deleted Webhooks are not visible in normal API responses. Soft-deleted Webhooks are permanently removed from normal API visibility." [ref=e2030]'
        - 'generic "rule: BR-010 A Webhook is always scoped to exactly one object instance via criteria. It cannot be configured to fire across multiple object instances." [ref=e2031]'
        - 'generic "rule: BR-011 Clients cannot create, read, update, or delete Webhooks." [ref=e2032]'
        - 'generic "rule: BR-012 The platform does not retry failed Webhook calls. A failed call is recorded in statistics and lost." [ref=e2033]'
        - 'generic "rule: BR-013 Webhooks are unaffected by the state of their owning [[Account]]. Since Accounts cannot be deleted, there is no cascade deletion path from [[Account]] to Webhook." [ref=e2034]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Yes*, update=Yes**, delete=No. *A Vendor can read its own Account and all Client Accounts that have transacted its products. Non-transacting Accounts return 404 — their existence is masked entirely. **A Vendor can update its own Account only." [ref=e2035]'
        - 'generic "constraint: Operations Operations: create=Yes, read=Yes, update=Yes, delete=No. Full read/write access to all Accounts. No DELETE endpoint exists in the spec." [ref=e2036]'
        - 'generic "constraint: Client Client: create=No, read=Yes*, update=Yes**, delete=No. *A Client can read its own Account only. All other Accounts return 404 — their existence is masked entirely. **A Client can update its own Account only." [ref=e2037]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Contextual, update=No, delete=No. Seller is surfaced as a reference on Authorizations and Listings. Vendor cannot query Sellers directly." [ref=e2038]'
        - 'generic "constraint: Operations Operations: create=Yes, read=Yes, update=Yes, delete=Yes*. *DELETE endpoint exists in the API spec. Whether a deletion guard exists in practice is not confirmed. See SEL-010." [ref=e2039]'
        - 'generic "constraint: Client Client: create=No, read=Contextual, update=No, delete=No. Seller is surfaced as a reference on Agreements and Orders. Client cannot query Sellers directly." [ref=e2040]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Yes*, update=Yes**, delete=No. *Vendor can read all fields except notes. **Vendor can only write settings. All other fields are Operations-managed." [ref=e2041]'
        - 'generic "constraint: Operations Operations: create=Yes, read=Yes, update=Yes, delete=Yes. Full access. Creates and manages Authorizations. Deletion subject to BR-006." [ref=e2042]'
        - 'generic "constraint: Client Client: create=No, read=Yes***, update=No, delete=No. ***Client sees Authorization id and name only, surfaced contextually on Agreement and Order detail. Clients cannot query Authorizations directly." [ref=e2043]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Yes*, update=No, delete=No. *Vendor sees Listing id and name only, surfaced contextually on Agreement and Order detail. Vendor cannot query Listings directly in a meaningful way." [ref=e2044]'
        - 'generic "constraint: Operations Operations: create=Yes, read=Yes, update=Yes, delete=Yes. Full access. Creates and manages Listings. Deletion subject to BR-007." [ref=e2045]'
        - 'generic "constraint: Client Client: create=No, read=Yes**, update=No, delete=No. **Client sees Listing id and name only, surfaced contextually on Agreement and Order detail. Clients cannot query Listings directly." [ref=e2046]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Yes*, update=Yes*, delete=No. *Vendor can read and set unitLP and unitPP only. markup, margin, unitSP, and all derived SP fields are not present in Vendor API responses. Vendor can set info.visible and info.description." [ref=e2047]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=Yes, delete=No. Full read and write access to all fields." [ref=e2048]'
        - 'generic "constraint: Client Client: create=No, read=Yes**, update=No, delete=No. **Client sees unitSP and period-normalised SP variants only, plus info fields, on Items that are ForSale and referenced via an active Listing." [ref=e2049]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes*, update=Yes*, delete=No. *Vendor cannot read or set markup, margin, defaultMarkup, defaultMargin, or any statistics fields that reflect margin or sales pricing. See Section 5." [ref=e2050]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=Yes, delete=Yes. Full read and write access including all pricing and margin fields. Deletion subject to BR-005." [ref=e2051]'
        - 'generic "constraint: Client Client: create=No, read=No, update=No, delete=No. Clients do not interact with Price Lists directly. Pricing is surfaced via Listings." [ref=e2052]'
        - 'generic "constraint: Vendor Vendor: create=—, read=—, update=—, delete=—. Pending canonisation." [ref=e2053]'
        - 'generic "constraint: Operations Operations: create=—, read=—, update=—, delete=—. Pending canonisation." [ref=e2054]'
        - 'generic "constraint: Client Client: create=—, read=—, update=—, delete=—. Pending canonisation." [ref=e2055]'
        - 'generic "constraint: Vendor Vendor: create=No, read=No, update=No, delete=No. Pricing Policies are not visible to Vendors." [ref=e2056]'
        - 'generic "constraint: Operations Operations: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership." [ref=e2057]'
        - 'generic "constraint: Client Client: create=No, read=No, update=No, delete=No. Pricing Policies are not visible to Clients. Their effect is felt during ordering but the policy itself is internal." [ref=e2058]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership of Item definitions. At scale, Item creation and management is typically automated via Vendor Extension." [ref=e2059]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=Yes*, delete=No. *Operations can set externalIds.operations (the SoftwareOne ERP part number). Cannot otherwise update Item definitions." [ref=e2060]'
        - 'generic "constraint: Client Client: create=No, read=Yes**, update=No, delete=No. **Clients see Published Items only, filtered to those available in their Listing''s Price List." [ref=e2061]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership" [ref=e2062]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. —" [ref=e2063]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=No, delete=No. Clients see Item Groups during the ordering process" [ref=e2064]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership" [ref=e2065]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. Read across all states including Draft" [ref=e2066]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=No, delete=No. Assets accessible by direct URL in all states. Only Published Media is listed on the Product page." [ref=e2067]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full ownership of Parameter definitions. Primary writer of parameter values across all scopes." [ref=e2068]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. Can read Parameter definitions. Can edit parameter values on live objects in exceptional circumstances." [ref=e2069]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=No, delete=No. Can read Parameter definitions. Can write parameter values on Agreement-scoped and Order-scoped, Order-phase parameters while an Order is in Draft or Querying state." [ref=e2070]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership" [ref=e2071]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. —" [ref=e2072]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=No, delete=No. Clients see Parameter Groups during the ordering and configuration process" [ref=e2073]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership" [ref=e2074]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. —" [ref=e2075]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=No, delete=No. Clients see the rendered Template on the General tab of the relevant object" [ref=e2076]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership. Can create, modify, submit to Pending, and delete (Draft only). Cannot unpublish." [ref=e2077]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. Can read. Can transition from Pending to Published, and between Published and Unpublished." [ref=e2078]'
        - 'generic "constraint: Client Client: create=No, read=Yes*, update=No, delete=No. *Clients see Published Variants only, when presented with the parent Terms for acceptance during Order creation." [ref=e2079]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Full lifecycle ownership. Can create, modify, submit to Pending, and delete (Draft only). Cannot unpublish." [ref=e2080]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. Can read. Can transition from Pending to Published, and between Published and Unpublished." [ref=e2081]'
        - 'generic "constraint: Client Client: create=No, read=Yes*, update=No, delete=No. *Clients see Published Terms only, presented during Order creation for acceptance." [ref=e2082]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=No. Primary lifecycle owner. Products cannot be deleted." [ref=e2083]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=No, delete=No. Read across all states including Draft. Collaborates with Vendor to make Product publishable." [ref=e2084]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=No, delete=No. Visible in Published state only. Existing-Agreement Clients retain transactional access in Unpublished state." [ref=e2085]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Yes, update=No, delete=No. Vendors read the full list when selecting a Unit of Measure during Item creation." [ref=e2086]'
        - 'generic "constraint: Operations Operations: create=Yes, read=Yes, update=Yes, delete=No. Full management of the reference set. Units of Measure cannot be deleted." [ref=e2087]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=No, delete=No. Clients can read Units of Measure. Typically encountered in the context of Item display." [ref=e2088]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Yes, update=Yes, delete=No. Read is scoped to Agreements where they are the Vendor. Can update `parameters.ordering`, `parameters.fulfillment`, `template`, and `externalIds.vendor`. No DELETE endpoint exists." [ref=e2089]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=Yes, delete=No. Read is not self-scoped — Operations sees all Agreements platform-wide. Can update `externalIds.operations`. No DELETE endpoint exists." [ref=e2090]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=Yes, delete=No. Read is scoped to Agreements belonging to their own Account. Can update `name`, `billingCurrency`, and `externalIds.client`. Cannot create or delete Agreements directly." [ref=e2091]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=No. Can create Assets directly (migration/edge cases) or via Order Processing. Can update `name`, `template`, `parameters.fulfillment`, `externalIds.vendor`. Can terminate via `/terminate` endpoint. Read is scoped to Assets on Agreements where they are the Vendor." [ref=e2092]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=Yes, delete=No. Can update `price.defaultMarkup`, `price.defaultMargin`, and manage markup on Asset Lines. Read is not self-scoped — Operations sees all Assets platform-wide." [ref=e2093]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=Yes, delete=No. Can update `name` and `externalIds.client`. Cannot create, terminate, or delete Assets. Read is scoped to Assets on Agreements belonging to their own Account." [ref=e2094]'
        - 'generic "constraint: Vendor Vendor: create=No, read=Yes, update=Yes, delete=Yes. Cannot create or place Orders — requires Client Actor context. Can update `parameters.ordering` and `parameters.fulfillment` during Processing. Can set `assignee` and `statusNotes`. Can transition Order status. Can delete Draft and Quoted Orders directly. Read is scoped to Orders on Agreements where they are the Vendor." [ref=e2095]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=Yes, delete=Yes. Cannot create or place Orders — a User must switch to a Client Account to do so. Can transition Order status including failing an Order. Can delete Draft and Quoted Orders directly. Read is not self-scoped — Operations sees all Orders platform-wide." [ref=e2096]'
        - 'generic "constraint: Client Client: create=Yes, read=Yes, update=Yes, delete=Yes. Can create, update, and place Orders. Can delete Draft and Quoted Orders only. Can update `parameters.ordering` during Draft and Querying only. Read is scoped to Orders belonging to their own Account." [ref=e2097]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=No. Can create Subscriptions directly (migration/edge cases) or via Order Processing. Can update `name`, `template`, `autoRenew`, `parameters.fulfillment`, `externalIds.vendor`. Can terminate via `/terminate` endpoint. Read is scoped to Subscriptions on Agreements where they are the Vendor." [ref=e2098]'
        - 'generic "constraint: Operations Operations: create=No, read=Yes, update=Yes, delete=No. Can update `price.defaultMarkup`, `price.defaultMargin`, and manage Split Billing via `/split` endpoint. Can also manage markup on Subscription Lines. Read is not self-scoped — Operations sees all Subscriptions platform-wide." [ref=e2099]'
        - 'generic "constraint: Client Client: create=No, read=Yes, update=Yes, delete=No. Can update `name` and `externalIds.client`. Cannot create, terminate, or delete Subscriptions. Read is scoped to Subscriptions on Agreements belonging to their own Account." [ref=e2100]'
        - 'generic "constraint: Vendor Vendor: create=Yes, read=Yes, update=Yes, delete=Yes. Owns Webhooks scoped to their Account" [ref=e2101]'
        - 'generic "constraint: Operations Operations: create=Yes, read=Yes, update=Yes, delete=Yes. Owns Webhooks scoped to the Operations Account" [ref=e2102]'
        - 'generic "constraint: Client Client: create=No, read=No, update=No, delete=No. Clients cannot create or interact with Webhooks" [ref=e2103]'
        - 'generic "risk: high Account disabled — Downstream effects on associated Users, API Tokens, and active transactions are not confirmed." [ref=e2104]'
        - 'generic "risk: high Client Account created without ERP CDG linkage — The platform permits this — the 1:1 CDG constraint is an operational discipline, not a platform-enforced rule. A Client Account without a valid ERP CDG may cause billing and procurement failures." [ref=e2105]'
        - 'generic "risk: high `eligibility` absent on Client Account — If both `eligibility.client` and `eligibility.partner` are false or absent, the Client may be unable to place Orders under any Listing." [ref=e2106]'
        - 'generic "risk: high `externalIds.pyraTenantId` conflict — If a `pyraTenantId` is reused or incorrectly assigned across Accounts, identity platform conflicts may occur. The platform does not confirm whether uniqueness is enforced." [ref=e2107]'
        - 'generic "risk: low User Group default deleted — The default User Group cannot be deleted directly — the Default Protection Pattern prevents this. Operations must first designate another group as default before the current default can be deleted." [ref=e2108]'
        - 'generic "risk: high Seller disabled — No new Orders can be placed under any Listing referencing this Seller. Existing Agreements and Subscriptions continue normally." [ref=e2109]'
        - 'generic "risk: high Currency removed from Seller currencies array — Effect on existing Authorizations and Listings denominated in the removed currency is not confirmed." [ref=e2110]'
        - 'generic "risk: medium externalId overridden by Operations — ERP-side correlation is broken until the ERP Sync process reconciles or the override is reverted." [ref=e2111]'
        - 'generic "risk: low Multiple Sellers exist for the same country — Platform permits this — address.country is not unique across Sellers. Multiple active Sellers for the same country is a valid configuration resulting from acquisition history." [ref=e2112]'
        - 'generic "risk: high Seller deleted — Platform behaviour not confirmed — deletion guard and downstream effects are unknown." [ref=e2113]'
        - 'generic "risk: low Missing icon field — One Seller in production (`BG_CPX`, `SEL-9696-0728`, Disabled) has no `icon` field in its API response, where all other Sellers return a jdenticon URL. Cause unknown — may be a data anomaly from migration or an edge case in icon behaviour for early-created or Disabled records." [ref=e2114]'
        - 'generic "risk: medium Duplicate Authorization created (same Seller, Vendor, Product, currency) — Second Authorization created successfully. Platform does not enforce uniqueness on this tuple." [ref=e2115]'
        - 'generic "risk: low Operations attempts to delete an Authorization with active Listings — Deletion blocked. Authorization cannot be deleted while any Listing exists." [ref=e2116]'
        - 'generic "risk: high settings blob contains sensitive credentials — Platform accepts the value — no content validation beyond well-formed JSON. Credentials stored in clear text." [ref=e2117]'
        - 'generic "risk: low journal.firstInvoiceDate is set incorrectly — No platform behaviour is triggered — the field is a reference value only. Incorrect date may cause missed billing reminders or operational confusion." [ref=e2118]'
        - 'generic "risk: medium Listing eligibility grants more than Authorization eligibility — Platform does not enforce consistency. Misconfiguration is possible and may produce unexpected results for Clients attempting to order." [ref=e2119]'
        - 'generic "risk: low Both eligibility flags set to false — No new Orders can be placed under this Listing. Existing Agreements and Subscriptions are unaffected." [ref=e2120]'
        - 'generic "risk: low Operations attempts to delete a Listing with non-terminal Agreements — Deletion blocked. Listing cannot be deleted while any Agreement is in a non-terminal state." [ref=e2121]'
        - 'generic "risk: high Primary Listing deleted without demoting first — Permitted if deletion guard is satisfied. If other Listings exist for the same Seller+Authorization, none will be primary after deletion — new Orders cannot be automatically routed until a new primary is designated." [ref=e2122]'
        - 'generic "risk: medium Listing Seller disabled — No new Orders can be placed under this Listing. Existing Agreements and Subscriptions continue normally. The Listing itself is unchanged — no state change, no deletion." [ref=e2123]'
        - 'generic "risk: low Listing Seller differs from Authorization Owner — Intercompany invoicing is triggered automatically during billing. No error — this is a supported and common configuration." [ref=e2124]'
        - 'generic "risk: high Price List Item set to ForSale with no pricing set — Transition succeeds. Item is available for purchase but has no prices. Client experience and ordering behaviour in this state is not yet confirmed." [ref=e2125]'
        - 'generic "risk: low unitLP not supported but unitPP is supported — Permitted. Vendor sets cost price without an RRP reference. Platform uses defaultMarkup from the parent Price List as the markup for this item (per Price List BR-006)." [ref=e2126]'
        - 'generic "risk: low info.description populated but info.visible = false — Description is stored but not shown to Client. No error." [ref=e2127]'
        - 'generic "risk: medium Product Item Unpublished while Price List Item is ForSale — Price List Item status remains ForSale but Item is effectively unavailable. Re-publishing the Product Item restores availability without a Price List Item status change." [ref=e2128]'
        - 'generic "risk: low Price List created for a currency already used by another Price List under the same Product — Second Price List created successfully. No constraint prevents multiple Price Lists per currency." [ref=e2129]'
        - 'generic "risk: medium Price List referenced by a Listing but has no ForSale Price List Items — Price List and Listing exist. No Items are available for purchase by Clients." [ref=e2130]'
        - 'generic "risk: n/a Operations attempts to delete a Price List that is still referenced by one or more Listings — Action is blocked. The Price List cannot be deleted while any Listing references it." [ref=e2131]'
        - 'generic "risk: high Billing: Charge cannot be reconciled against Subscription, Agreement, or Price List — Behaviour not defined in this canon — outside scope of Price List object." [ref=e2132]'
        - 'generic "risk: medium Pricing Policy activated with no Products specified — Policy applies to all Products for the scoped Client. Any Order for that Client will be subject to the yield cap regardless of Product." [ref=e2133]'
        - 'generic "risk: high Multiple active Pricing Policies for the same Client and eligibility — Behaviour not yet confirmed — it is unclear whether the most restrictive cap, the most recent, or some other resolution applies." [ref=e2134]'
        - 'generic "risk: low Pricing Policy disabled while an Order is in progress — Existing in-flight Orders are unaffected. The cap is only enforced at Order creation time." [ref=e2135]'
        - 'generic "risk: medium Item unpublished while referenced in active Price Lists — Item is no longer visible to Clients in the storefront. Existing Order lines and Agreements referencing this Item are unaffected." [ref=e2136]'
        - 'generic "risk: low Item unpublished while referenced on an active Agreement or Subscription — Existing Agreements and Subscriptions are unaffected. The Item simply cannot be ordered again until re-published." [ref=e2137]'
        - 'generic "risk: medium Vendor submits an Order quantity the Extension considers invalid — The platform accepts the quantity. The Vendor Extension is responsible for validation during Draft Order processing, typically via a Webhook." [ref=e2138]'
        - 'generic "risk: medium externalIds.operations not set — Item has no SoftwareOne ERP reference. Operational processes that depend on this field (e.g. billing, procurement) may fail or require manual intervention." [ref=e2139]'
        - 'generic "risk: n/a Vendor attempts to delete the Default Item Group — Action is blocked. Default Item Group cannot be deleted." [ref=e2140]'
        - 'generic "risk: n/a Vendor attempts to delete an Item Group that contains Items — Action is blocked. Item Group cannot be deleted while it contains Items." [ref=e2141]'
        - 'generic "risk: medium Media remains in Pending indefinitely (Operations never acts) — Media stays in Pending. Vendor has no exit mechanism." [ref=e2142]'
        - 'generic "risk: medium Video type Media created with an invalid or unreachable URL — Platform accepts the value without validation. The URL is stored as supplied. Client-facing rendering may fail silently if the URL is invalid or unreachable." [ref=e2143]'
        - 'generic "risk: n/a Published Media deleted — not possible — Deletion is blocked in all states except Draft." [ref=e2144]'
        - 'generic "risk: low Parameter soft-deleted while referenced by a Template substitution token — Template continues to render correctly. Soft-deleted parameter values are preserved and resolvable." [ref=e2145]'
        - 'generic "risk: low Parameter soft-deleted while referenced by a live Order, Agreement, Asset, or Subscription — Parameter values are preserved on all live objects. No render failure. No cascade." [ref=e2146]'
        - 'generic "risk: low Vendor Extension modifies instance-level constraints on an Order prior to completion — Modified constraints — not definition defaults — are copied to the Agreement on Order completion." [ref=e2147]'
        - 'generic "risk: low Vendor updates definition-level constraints after live object instances exist — Definition-level change has no effect on existing instances. Instance-level constraints on live objects are unaffected regardless of whether they were previously overridden or defaulted from the definition." [ref=e2148]'
        - 'generic "risk: medium Required parameter has no value when Order is submitted — Behavior governed by Order state machine validation — to be documented in Commerce: Order canon." [ref=e2149]'
        - 'generic "risk: n/a Vendor attempts to delete the Default Parameter Group — Action is blocked. Default Parameter Group cannot be deleted." [ref=e2150]'
        - 'generic "risk: n/a Vendor attempts to delete a Parameter Group that contains Parameters — Action is blocked. Parameter Group cannot be deleted while it contains Parameters." [ref=e2151]'
        - 'generic "risk: medium Template deleted while applied to an active Order, Agreement, Asset, or Subscription — Template fails to render on the affected object(s). No other behavior is affected." [ref=e2152]'
        - 'generic "risk: low Parameter referenced in a substitution field is soft-deleted — Template renders correctly. Soft-deleted parameters are preserved and their values remain resolvable at render time." [ref=e2153]'
        - 'generic "risk: n/a Vendor attempts to delete a Default Template — Action is blocked. Default Templates cannot be deleted." [ref=e2154]'
        - 'generic "risk: medium Parent Terms published with all Variants in Draft — Variant content is not shown to Client. Client sees the Terms entry but has no content to read or accept." [ref=e2155]'
        - 'generic "risk: medium Online Variant URL becomes unavailable after publishing — Platform does not validate URL availability. Client will encounter a broken link." [ref=e2156]'
        - 'generic "risk: medium All Published Variants for a Terms object are unpublished while Terms remains Published — Same as above — Terms entry visible to Client but no content available." [ref=e2157]'
        - 'generic "risk: medium Terms Published with no Published Variants — Terms entry is shown to Client during Order creation but no content is available to read. Client may still be required to accept." [ref=e2158]'
        - 'generic "risk: low Terms unpublished after Client has already accepted them on an Agreement — Existing acceptance records on Agreements are unaffected. The Terms is simply no longer presented to new Clients." [ref=e2159]'
        - 'generic "risk: high Vendor edits behavioral settings on a Published Product with active downstream objects — Settings update is applied immediately. No warning or guard." [ref=e2160]'
        - 'generic "risk: medium Product remains in Pending indefinitely (Operations never acts) — Product stays in Pending. Vendor has no exit mechanism." [ref=e2161]'
        - 'generic "risk: low Operations updates name or description of a Unit of Measure in active use — Update succeeds. All Product Items referencing this unit immediately reflect the new values." [ref=e2162]'
        - 'generic "risk: low Vendor cannot find a suitable Unit of Measure for their Item — Vendor must select the closest available unit or request Operations to create a new one. Platform does not allow Vendors to create units." [ref=e2163]'
        - 'generic "risk: high Agreement remains in Provisioning or Updating indefinitely — No platform-level safeguard. The Agreement remains in a non-Active status if the associated Order is abandoned in Processing or Querying. No further Orders can be placed against the Agreement while it is in this state." [ref=e2164]'
        - 'generic "risk: high Purchase Order fails after Agreement reaches Provisioning — Agreement → Failed. Permanently terminal. A new Purchase Order must be created to retry — the platform co-creates a new Agreement automatically." [ref=e2165]'
        - 'generic "risk: medium All Subscriptions terminated without a Termination Order — The platform automatically transitions the Agreement to Terminated when the last Subscription reaches Terminated status. Assets are unaffected and remain in their current state." [ref=e2166]'
        - 'generic "risk: low Client attempts to modify Agreement-scoped parameters after Purchase Order completes — The platform does not permit the Client to modify Agreement-scoped parameters after the Purchase Order completes. Only the Vendor can update these parameters." [ref=e2167]'
        - 'generic "risk: low `billingCurrency` set to a currency not in Seller''s `currencies` array — The platform rejects the update. `billingCurrency` must be a currency present in the Seller''s `currencies` array." [ref=e2168]'
        - 'generic "risk: medium Agreement price manually overridden but underlying Subscriptions change — The manually set Agreement price is not automatically recomputed when Subscriptions are added, removed, or modified. The Vendor is responsible for keeping the manually overridden price current." [ref=e2169]'
        - 'generic "risk: medium Failed Agreement blocks new purchases for same Product and Client — A Failed Agreement remains visible in the API. A new Purchase Order creates a new Agreement — the Failed Agreement is not replaced or archived. Both exist simultaneously in the API." [ref=e2170]'
        - 'generic "risk: low Vendor terminates Asset but parent Agreement is already Terminated — The Asset can be terminated regardless of Agreement status — Asset termination has no dependency on Agreement status, and vice versa. The `/terminate` endpoint is available on Active Assets regardless of Agreement state." [ref=e2171]'
        - 'generic "risk: medium Active Assets remain after Agreement terminates — When all Subscriptions on an Agreement are Terminated, the Agreement transitions to Terminated — but Active Assets are unaffected and remain Active. The Client retains access to their Asset records under the Terminated Agreement." [ref=e2172]'
        - 'generic "risk: low No `terminationDate` on Asset — Unlike Subscription, there is no `terminationDate` field on the Asset schema. The only record of when an Asset was Terminated is the `audit.updated` timestamp, which requires `select=+audit` to retrieve." [ref=e2173]'
        - 'generic "risk: medium Vendor creates Asset directly without Order — The Asset is created directly in Active status and linked to the Agreement. No Order audit trail exists for this Asset''s creation." [ref=e2174]'
        - 'generic "risk: low Purchase or Change Order fails after OrderAsset created — The OrderAsset is abandoned with the Order. The live Asset is never promoted — no AST-prefixed Asset is created. The OrderAsset is only accessible via the Order endpoint and does not appear in the Assets list." [ref=e2175]'
        - 'generic "risk: high Pre-validation Webhook unreachable at Draft — The `/validate` endpoint returns 200 OK with the unaltered Order body. No error is surfaced to the caller. The Order proceeds as if validation passed." [ref=e2176]'
        - 'generic "risk: high Pre-validation Webhook unreachable at Querying — Same behaviour as Draft — `/validate` returns 200 OK with unaltered Order body. A Querying Order with unvalidated parameters may be returned to Processing and subsequently fail during fulfilment." [ref=e2177]'
        - 'generic "risk: medium Order placed with competing Draft/Quoted Orders on same Agreement — All competing Draft and Quoted Orders on the Agreement are automatically moved to Deleted status. Clients who had prepared those Orders are not notified." [ref=e2178]'
        - 'generic "risk: high Purchase Order fails after Agreement reaches Provisioning — The Order moves to Failed and the Agreement moves to Failed. The Client cannot transact against a Failed Agreement. A new Purchase Order must be created to retry — the platform will co-create a new Agreement automatically." [ref=e2179]'
        - 'generic "risk: medium Change, Configuration, or Termination Order fails — The Agreement reverts to Active with all Subscriptions and Assets unchanged. The failed Order remains visible in the API in Failed status. A new Order must be created to retry the intended change." [ref=e2180]'
        - 'generic "risk: high Order remains in Querying status indefinitely — The platform does not enforce a timeout on Querying status. If neither the Client nor the Vendor acts, the Order remains in Querying indefinitely. The Agreement remains in Updating status for the duration, which may affect other operations against that Agreement." [ref=e2181]'
        - 'generic "risk: medium Parameter values modified by Vendor Extension exceed Actor write permissions — The platform enforces Actor-based write rules on Extension modifications during pre-validation. Modifications to suppressed fields — such as `markup` or `margin` — are rejected." [ref=e2182]'
        - 'generic "risk: low Client places Order against a Listing whose Seller does not match the Licensee Seller — The platform rejects the Order at creation with a validation error. The Order is not persisted." [ref=e2183]'
        - 'generic "risk: medium Client attempts to place Order without a required Certificate — The platform rejects the Order at creation. The Client must obtain the required Certificate before placing the Order." [ref=e2184]'
        - 'generic "risk: medium Multiple Orders placed rapidly against the same Agreement — The platform enforces a single Processing Order constraint per Agreement. A second Order cannot be placed while one is already Processing. However, a race condition may exist if two Orders are submitted simultaneously before either reaches Processing status." [ref=e2185]'
        - 'generic "risk: low Draft Subscriptions or Assets created during Processing not mapped before completion attempted — The platform prevents Order completion if any Lines remain unmapped to a Subscription or Asset. The Vendor must map all Lines before the Order can be Completed." [ref=e2186]'
        - 'generic "risk: high Agreement remains in Updating or Provisioning status due to a long-running Order — While an Agreement is in Updating or Provisioning status, other operations against that Agreement may be blocked. If a Processing or Querying Order is abandoned, the Agreement may remain in a non-Active status indefinitely." [ref=e2187]'
        - 'generic "risk: high `autoRenew` not set to false before `commitmentDate` — The platform''s renewal service will renew the Subscription automatically, extending `commitmentDate` and generating a billing event. The Client may be charged for an unintended renewal period." [ref=e2188]'
        - 'generic "risk: medium Termination Order fails — Subscription reverts to Active — The Subscription reverts to Active unchanged. The Agreement reverts to Active. A new Termination Order must be created to retry. The renewal service will continue to evaluate the Subscription on its normal schedule." [ref=e2189]'
        - 'generic "risk: high Subscription remains in Updating indefinitely — No platform-level safeguard. If the associated Order is abandoned, the Subscription remains in Updating indefinitely." [ref=e2190]'
        - 'generic "risk: medium Vendor creates Subscription directly without Order — The Subscription is created directly in Active status and linked to the Agreement. No Order audit trail exists for this Subscription." [ref=e2191]'
        - 'generic "risk: medium All Subscriptions on an Agreement expire — The platform transitions each Subscription to Expired individually as their `commitmentDate` passes. Once all Subscriptions are Expired, the Agreement transitions to Terminated. Assets are unaffected." [ref=e2192]'
        - 'generic "risk: low Terms mismatch between Subscription and Line — The platform enforces that Line terms must match the parent Subscription''s terms. A Line with mismatched terms cannot be added to the Subscription." [ref=e2193]'
        - 'generic "risk: medium Webhook endpoint is unreachable or returns an error — Call recorded as failure in statistics. failuresSinceLastSuccess incremented. No automated platform response. No retry." [ref=e2194]'
        - 'generic "risk: medium Webhook fires while Extension is being deployed or restarted — Call fails. Recorded as failure. No retry or queuing." [ref=e2195]'
        - 'generic "risk: medium Criteria references a deleted or unpublished object (e.g. deleted Product) — Webhook may continue to fire or may never match — depends on criteria evaluation." [ref=e2196]'
