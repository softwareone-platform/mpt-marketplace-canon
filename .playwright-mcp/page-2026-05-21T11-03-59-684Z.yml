        - 'generic "rule: BR-001 Assets are owned by the Vendor. The Vendor Extension creates and maintains Assets as the authoritative fulfilment record for one-time purchase Items. This mirrors the Vendor ownership model for Subscriptions." [ref=e1870]'
        - 'generic "rule: BR-002 An Asset is normally created during [[Order]] Processing as an OrderAsset and promoted to a live Asset when the Purchase or Change [[Order]] completes. The platform promotes the OrderAsset to a live Asset, retaining the same ID. The live Asset is created directly in Active status — the Draft state is scoped to the [[Order]] only." [ref=e1871]'
        - 'generic "rule: BR-003 The only path to Terminated status is direct Vendor action via the `/terminate` endpoint. There is no Termination [[Order]] path for Assets — Termination Orders apply to Subscriptions only. Assets are unaffected by Termination Orders." [ref=e1872]'
        - 'generic "rule: BR-004 Terminated is a permanently terminal state. A Terminated Asset cannot be reactivated. A new Asset must be created — typically via a new Purchase or Change [[Order]] — to replace a terminated Asset." [ref=e1873]'
        - 'generic "rule: BR-005 A Terminated Asset has no effect on its parent [[Agreement]]''s status. [[Agreement]] termination is driven exclusively by [[Subscription]] state. Active Assets can exist under Terminated Agreements, and Terminated Assets can exist under Active Agreements." [ref=e1874]'
        - 'generic "rule: BR-006 There is no renewal service for Assets. Assets have no `commitmentDate` and no `autoRenew` flag. Once Active, an Asset remains Active indefinitely unless the Vendor terminates it." [ref=e1875]'
        - 'generic "rule: BR-007 Asset-scoped `parameters.fulfillment` are written and maintained exclusively by the Vendor. The Client cannot update Asset parameters directly. Parameters are retained on a Terminated Asset — they are not cleared on termination." [ref=e1876]'
        - 'generic "rule: BR-008 The `terms` object on an Asset is always `model: \"one-time\"` and `period: \"one-time\"`. The `commitment` field is absent. [[Terms]] are set at Asset creation and are immutable thereafter." [ref=e1877]'
        - 'generic "rule: BR-009 There is no DELETE endpoint on Asset. The only path to a terminal state is Termination via the `/terminate` endpoint." [ref=e1878]'
        - 'generic "rule: BR-010 The `name` field on an Asset can be updated by any Actor." [ref=e1879]'
        - 'generic "rule: BR-011 The `template` field on an Asset can be set and updated by the Vendor in any non-terminal status. The template is present on both Active and Terminated Assets in observed samples." [ref=e1880]'
        - 'generic "rule: BR-012 Operations can update `price.defaultMarkup` and `price.defaultMargin` directly on an Asset, and can manage markup on Asset Lines. These are the only direct update capabilities available to the Operations Actor on an Asset." [ref=e1881]'
        - 'generic "rule: BR-013 Asset pricing uses one-time price fields. `PPx1` (purchase price, one-time) is visible to Vendor and Operations. `SPx1` (selling price, one-time) is visible to Client and Operations. `markup`, `margin`, `defaultMarkup`, `defaultMargin`, `defaultMarkupSource`, and `markupSource` are visible to Operations only." [ref=e1882]'
        - 'generic "rule: BR-014 Asset visibility is self-scoped per Actor: Vendor sees only Assets on Agreements where they are the Vendor; Client sees only Assets on Agreements belonging to their own [[Account]]; Operations sees all Assets platform-wide." [ref=e1883]'
        - 'generic "rule: BR-015 The Asset carries `priceList` and `listing` references directly. This differs from [[Subscription]], which does not carry these fields at the top level." [ref=e1884]'
        - 'generic "rule: BR-016 The Asset does not carry `buyer` or `seller` as top-level references. These are accessible via the Asset''s Lines." [ref=e1885]'
        - 'generic "rule: BR-017 There is no `terminationDate` field on the Asset schema. When an Asset is Terminated, the termination timestamp is recorded only in `audit.updated`. This differs from [[Subscription]], which has an explicit `terminationDate` field set by the platform on termination." [ref=e1886]'
        - 'generic "rule: BR-018 The Asset `audit` block contains only `created` and `updated` sub-keys. There are no state-specific audit sub-keys (no `active`, `terminated`, etc.). This is simpler than the [[Subscription]] audit model." [ref=e1887]'
