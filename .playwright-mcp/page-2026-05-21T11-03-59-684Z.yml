        - 'generic "rule: BR-001 A Media object belongs to exactly one [[Product]] and cannot be shared across Products." [ref=e1608]'
        - 'generic "rule: BR-002 A Media object has a type. Valid types are: Image, Video. Type is immutable after creation." [ref=e1609]'
        - 'generic "rule: BR-003 For Image type Media, the content is an uploaded binary file. The filename, size, and contentType attributes are set by the platform on upload. The url attribute is not used." [ref=e1610]'
        - 'generic "rule: BR-004 For Video type Media, the content is a reference to an externally hosted video. The url attribute stores the external video URL (e.g. a YouTube link). A thumbnail image file must also be uploaded at creation time — this is stored as the binary content of the Media object." [ref=e1611]'
        - 'generic "rule: BR-005 Media can only be deleted in Draft state." [ref=e1612]'
        - 'generic "rule: BR-006 Once a Media object is submitted to Pending, the Vendor cannot withdraw it. The only exit from Pending is publication by Operations." [ref=e1613]'
        - 'generic "rule: BR-007 A Media object in Pending state cannot be returned to Draft." [ref=e1614]'
        - 'generic "rule: BR-008 A Media object can cycle between Published and Unpublished states without limit." [ref=e1615]'
        - 'generic "rule: BR-009 Media creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1616]'
        - 'generic "rule: BR-010 The displayOrder attribute controls the sequence in which Media objects are presented on the [[Product]] page." [ref=e1617]'
        - 'generic "rule: BR-011 Media state controls discoverability, not accessibility. A Media asset is always accessible by direct URL regardless of state. State determines only whether the platform lists the URL in any UI or API response." [ref=e1618]'
        - 'generic "rule: BR-012 The platform does not validate external Video URLs. URL validity is the Vendor''s responsibility." [ref=e1619]'
