        - 'generic "rule: BR-001 An Item belongs to exactly one [[Product]] and cannot be shared across Products." [ref=e1557]'
        - 'generic "rule: BR-002 An Item belongs to an [[Item Group]]. If no group is specified on creation, the Item is automatically assigned to the Default [[Item Group]]." [ref=e1558]'
        - 'generic "rule: BR-003 [[Item Group]] flags (multiple, required) are enforced by the platform at [[Order]] submission. This is one of the few places where the platform itself enforces constraints rather than delegating to the Vendor Extension." [ref=e1559]'
        - 'generic "rule: BR-004 [[Product]] Items represent the full union of all orderable SKUs across all regions and currencies. Availability of an Item for sale in a given currency is controlled by the [[Price List]], not by the Item itself." [ref=e1560]'
        - 'generic "rule: BR-005 Items are ordered with an integer quantity. Fractional quantities are not supported." [ref=e1561]'
        - 'generic "rule: BR-006 Item quantity constraints (min, max) are not enforced by the platform. Quantity validation is the responsibility of the Vendor Extension, typically during Draft [[Order]] validation." [ref=e1562]'
        - 'generic "rule: BR-007 An Item has commercial terms comprising a billing model, a billing period, and a commitment period. These are set by the Vendor and are immutable after creation." [ref=e1563]'
        - 'generic "rule: BR-008 Valid terms.model values are: quantity, usage, one-time. The quantity model bills per unit of quantity. The usage model bills based on consumption — when terms.model = usage, quantityNotApplicable is always true (these are coupled; setting usage model implies quantity is not applicable). The one-time model represents a single non-recurring charge." [ref=e1564]'
        - 'generic "rule: BR-009 Valid terms.period values are: 1m, 1y, one-time. Period represents the billing cycle." [ref=e1565]'
        - 'generic "rule: BR-010 Valid terms.commitment values are: 1m, 1y, 3y. Commitment is nullable — when absent, no minimum contractual term applies. Commitment represents the minimum contractual term. Period and commitment may differ — for example, a 1-month billing period with a 1-year commitment is valid." [ref=e1566]'
        - 'generic "rule: BR-011 When quantityNotApplicable is true, quantity is not relevant for this Item and is not collected or displayed. When terms.model = usage, quantityNotApplicable is always true — the two are coupled." [ref=e1567]'
        - 'generic "rule: BR-012 An Item has a [[Unit of Measure]] that describes what is being counted or measured (e.g. User, Licenses, Gigabytes). Units of Measure are platform-level reference objects scoped to the Catalog namespace; Vendors select from the available set when creating an Item." [ref=e1568]'
        - 'generic "rule: BR-013 An Item has two external ID namespaces: externalIds.vendor (set by the Vendor — the vendor''s own SKU identifier) and externalIds.operations (set by Operations — the SoftwareOne ERP part number). These are managed independently by different Actors." [ref=e1569]'
        - 'generic "rule: BR-014 Item creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1570]'
        - 'generic "rule: BR-015 Item-scoped Parameters store Vendor-defined metadata about an Item. They are surfaced in the Items list during ordering and are filterable by Clients (e.g. a \"[[Product]] Family\" parameter with values \"Document Cloud\" / \"Creative Cloud\"). The only available constraint for Item-scoped Parameters is required. See [[Parameter]] canon BR-022." [ref=e1571]'
