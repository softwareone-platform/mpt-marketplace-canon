        - 'generic "rule: BR-001 An Order must be created within the scope of an [[Agreement]]. For Purchase Orders, the platform automatically creates a corresponding Draft [[Agreement]] at the same moment the Order is first persisted. For Change, Configuration, and Termination Orders, the Order is created against an existing Active [[Agreement]]." [ref=e1926]'
        - 'generic "rule: BR-002 Only the Client Actor can create and place Orders. A User must switch to a Client [[Account]] to create or place an Order. The Vendor Actor cannot create or place Orders under any circumstance." [ref=e1927]'
        - 'generic "rule: BR-003 At the time of Order creation, the platform validates: (a) the [[Listing]] must be Active; (b) the [[Seller]] of the [[Listing]] must match the [[Seller]] of the Licensee; (c) all supplied [[Parameter]] values must be valid according to their [[Parameter]] definitions." [ref=e1928]'
        - 'generic "rule: BR-004 [[Parameter]] values are re-validated on every save, not only at Order creation." [ref=e1929]'
        - 'generic "rule: BR-005 There can be only one Order in Processing status for a given [[Agreement]] at any time." [ref=e1930]'
        - 'generic "rule: BR-006 When an Order is placed (transitions to Processing), all other Draft and Quoted Orders on the same [[Agreement]] are automatically moved to Deleted status. This is executed under the placing Client''s token context." [ref=e1931]'
        - 'generic "rule: BR-007 A Draft Order can be quoted by the Client Actor, moving it to Quoted status. An Order can also be created directly in Quoted status by the Client. Quoted status signals to the Client that the Order is ready to be placed. There is no material difference between Draft and Quoted except that parameter values cannot be edited in Quoted status. Draft → Quoted is a one-way transition." [ref=e1932]'
        - 'generic "rule: BR-008 During Draft status, only the Client Actor can write to `parameters.ordering`. No Actor can write to `parameters.fulfillment`." [ref=e1933]'
        - 'generic "rule: BR-009 During Quoted status, no Actor can write to either `parameters.ordering` or `parameters.fulfillment`." [ref=e1934]'
        - 'generic "rule: BR-010 During Processing status, only the Vendor Actor can write to `parameters.ordering` and `parameters.fulfillment`." [ref=e1935]'
        - 'generic "rule: BR-011 During Querying status, only the Client Actor can write to `parameters.ordering`. No Actor can write to `parameters.fulfillment`." [ref=e1936]'
        - 'generic "rule: BR-012 Parameters with `hidden=true` are suppressed from API responses for the Client Actor. Hidden parameters are readable by Vendor and Operations in all statuses." [ref=e1937]'
        - 'generic "rule: BR-012a Order parameters carry a `scope` field that determines their lifecycle. [[Agreement]]-scoped parameters (`scope: \"[[Agreement]]\"`) on a Purchase Order are carried over to the [[Agreement]] on Order completion and persist on the [[Agreement]] independently of any individual Order. Order-scoped parameters (`scope: \"Order\"`) exist only on the Order and are never carried over to the [[Agreement]]. Purchase Orders may carry both [[Agreement]]-scoped and Order-scoped parameters. Change, Configuration, and Termination Orders may only carry Order-scoped parameters — [[Agreement]]-scoped parameter modification is not possible via these Order types." [ref=e1938]'
        - 'generic "rule: BR-013 An Order in Processing status can be moved to Querying status by the Vendor. The Order must return to Processing before it can be Completed or Failed." [ref=e1939]'
        - 'generic "rule: BR-014 When an Order is in Querying status, the Client should be directed to either correct invalid parameter values or complete an external task before the Order can proceed. It is good practice for the Vendor to set the Order [[Template]] to one that contains clear instructions for the Client." [ref=e1940]'
        - 'generic "rule: BR-015 Only Draft and Quoted Orders can be deleted. Deletion moves the Order to Deleted status — it is not permanently removed and remains retrievable via the API including in standard list responses." [ref=e1941]'
        - 'generic "rule: BR-016 When a Draft or Quoted Purchase Order is deleted, the platform automatically moves the corresponding Draft [[Agreement]] to Deleted status. When a Draft or Quoted Change, Configuration, or Termination Order is deleted, the [[Agreement]] is unaffected and remains Active." [ref=e1942]'
        - 'generic "rule: BR-017 Failed is a terminal status. A Failed Order cannot be retried or reactivated. A new Order must be created to retry the intended change." [ref=e1943]'
        - 'generic "rule: BR-018 When an Order fails, the failing Actor may optionally set `statusNotes` to communicate the reason for failure to the Client. `statusNotes` contains a structured object with an error code (`id`) and a human-readable `message`." [ref=e1944]'
        - 'generic "rule: BR-019 For Purchase Orders: when the Order transitions to Processing, the [[Agreement]] transitions to Provisioning. When the Order completes, the [[Agreement]] transitions to Active and all Draft Subscriptions and Assets created during Processing transition to Active. When the Order fails, the [[Agreement]] transitions to Failed." [ref=e1945]'
        - 'generic "rule: BR-020 For Change Orders: when the Order transitions to Processing, the [[Agreement]] transitions to Updating and all affected pre-existing Subscriptions transition to Updating. When the Order completes, the [[Agreement]] and affected Subscriptions return to Active. When the Order fails, the [[Agreement]] and all Subscriptions return to Active unchanged." [ref=e1946]'
        - 'generic "rule: BR-021 For Configuration and Termination Orders: when the Order transitions to Processing, the [[Agreement]] transitions to Updating. When the Order fails, the [[Agreement]] returns to Active with all Subscriptions and Assets unchanged." [ref=e1947]'
        - 'generic "rule: BR-022 For Termination Orders: when the Order completes, the terminated Subscriptions transition to Terminated. If all Subscriptions on the [[Agreement]] are Terminated as a result, the [[Agreement]] also transitions to Terminated. Assets cannot be terminated and are unaffected by Termination Orders." [ref=e1948]'
        - 'generic "rule: BR-023 For Configuration Orders: the Order operates at the [[Subscription]] property level, not the Line level. Configuration Orders do not create or terminate Subscriptions. The `lines` array is not present on Configuration Orders. The Vendor completes a Configuration Order at their discretion — there is no Line mapping precondition." [ref=e1949]'
        - 'generic "rule: BR-024 Every Line in a Purchase, Change, or Termination Order must be mapped to a [[Subscription]] or [[Asset]] before the Order can be moved to Completed. Draft Subscriptions and Assets are created by the Vendor Extension during Processing and linked to the Order. On completion, they are linked to the [[Agreement]] and transitioned to Active." [ref=e1950]'
        - 'generic "rule: BR-025 The `assignee` field may be set by the Vendor to indicate the User or API Token responsible for processing the Order. It is optional and has no material effect on Order processing or state transitions." [ref=e1951]'
        - 'generic "rule: BR-026 Orders have three external identifier fields: `externalIds.vendor` (Vendor''s own order reference), `externalIds.operations` (ERP reference), and `externalIds.client` (Client reference such as a purchase order number). All are optional." [ref=e1952]'
        - 'generic "rule: BR-027 A Client must hold a valid Certificate for the Program assigned to a [[Product]] in order to place an Order for that [[Product]]. If no Program is assigned to the [[Product]], no Certificate is required." [ref=e1953]'
        - 'generic "rule: BR-028 The platform supports Vendor-defined pre-validation of Orders via a `/validate` endpoint. Pre-validation is enabled per Order type via boolean settings on the [[Product]]: `settings.preValidation.purchaseOrderDraft`, `settings.preValidation.changeOrderDraft`, `settings.preValidation.configurationOrderDraft`, `settings.preValidation.terminationOrder`, and `settings.preValidation.purchaseOrderQuerying`." [ref=e1954]'
        - 'generic "rule: BR-029 When `/validate` is called on an Order and the corresponding `preValidation` setting is `true`, the platform first persists the Order, then fires the corresponding [[Webhook]] to the Vendor Extension endpoint. The Extension may validate and optionally modify the Order — for example adjusting [[Unit]] PP on Lines. The modified Order is persisted again and returned as the response to `/validate`. If the corresponding `preValidation` setting is `false`, `/validate` returns the unaltered Order body. The `/validate` endpoint may be called multiple times on the same Order." [ref=e1955]'
        - 'generic "rule: BR-030 Modifications made by the Vendor Extension during pre-validation are subject to the same Actor-based write rules as direct API writes. For example, an Extension acting as a Vendor token cannot modify `markup` or `margin` fields." [ref=e1956]'
        - 'generic "rule: BR-031 If the Extension returns a validation failure, the failure is communicated to the caller in the `/validate` response with a 400 status and an error message provided by the Extension. The Order remains in its current status." [ref=e1957]'
        - 'generic "rule: BR-032 Webhooks used for pre-validation are reverse proxied by the platform. If the platform cannot reach the Vendor Extension, the `/validate` endpoint returns 200 OK with the unaltered Order body. No error is surfaced to the caller." [ref=e1958]'
        - 'generic "rule: BR-033 The `settings.preValidation.purchaseOrderQuerying` setting applies specifically to Purchase Orders in Querying status. When `/validate` is called on a Purchase Order in Querying status and this setting is `true`, the corresponding `ValidatePurchaseOrderQuerying` [[Webhook]] is fired." [ref=e1959]'
