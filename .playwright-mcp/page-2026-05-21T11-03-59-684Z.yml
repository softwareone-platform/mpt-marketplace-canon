        - 'generic "rule: BR-001 An [[Item]] Group belongs to exactly one [[Product]] and cannot be shared across Products." [ref=e1582]'
        - 'generic "rule: BR-002 Exactly one [[Item]] Group per [[Product]] must be marked as Default." [ref=e1583]'
        - 'generic "rule: BR-003 If a new [[Item]] is created without specifying an [[Item]] Group, it is automatically assigned to the Default [[Item]] Group." [ref=e1584]'
        - 'generic "rule: BR-004 The `multiple` attribute controls whether a Client can select more than one [[Item]] from the group when placing an [[Order]]." [ref=e1585]'
        - 'generic "rule: BR-005 The `required` attribute controls whether a Client must select at least one [[Item]] from the group when placing an [[Order]]." [ref=e1586]'
        - 'generic "rule: BR-006 The `displayOrder` attribute controls the sequence in which [[Item]] Groups are presented during the ordering process." [ref=e1587]'
        - 'generic "rule: BR-007 [[Item]] Group creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1588]'
        - 'generic "rule: BR-008 The Default [[Item]] Group cannot be deleted. To delete a Default [[Item]] Group, the Vendor must first designate another [[Item]] Group as Default." [ref=e1589]'
        - 'generic "rule: BR-009 An [[Item]] Group cannot be deleted if it contains Items. All Items must be removed or reassigned before the group can be deleted." [ref=e1590]'
