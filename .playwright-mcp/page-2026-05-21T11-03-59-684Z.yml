        - 'generic "term: revision" [ref=e1419]'
        - 'generic "rule: BR-001 A Listing belongs to exactly one [[Authorization]]. It cannot be reassigned to a different [[Authorization]] after creation." [ref=e1420]'
        - 'generic "rule: BR-002 A Listing references exactly one [[Price List]]. The currency of the [[Price List]] must match the currency of the [[Authorization]]." [ref=e1421]'
        - 'generic "rule: BR-003 A Listing references exactly one [[Seller]] — the SoftwareOne entity that will invoice the Client for Orders placed under this Listing. The [[Seller]] may be the same as the [[Authorization]] Owner or a different [[Seller]]." [ref=e1422]'
        - 'generic "rule: BR-004 Among all Listings sharing the same [[Seller]] and [[Authorization]], exactly one must be marked as primary. When a new [[Order]] is placed under that [[Seller]] and [[Authorization]], it is placed under the primary Listing." [ref=e1423]'
        - 'generic "rule: BR-005 Marking a Listing as primary automatically demotes any existing primary Listing with the same [[Seller]] and [[Authorization]] combination. There is always exactly one primary per [[Seller]]+[[Authorization]] combination." [ref=e1424]'
        - 'generic "rule: BR-006 eligibility.client and eligibility.partner control which Client types may place Orders under this Listing. Setting both to false effectively suspends the Listing — no Client can place new Orders under it. This is a valid operational configuration for temporary order suspension." [ref=e1425]'
        - 'generic "rule: BR-006a The Listing cannot grant more eligibility than the [[Authorization]] permits. However, this is not platform-enforced — a Listing may be configured with broader eligibility than its [[Authorization]], which constitutes a misconfiguration. Operations is responsible for ensuring Listing eligibility is consistent with [[Authorization]] eligibility." [ref=e1426]'
        - 'generic "rule: BR-007 A Listing can only be deleted if it has no Agreements in an active state. Specifically, deletion is permitted only when all associated Agreements are in Deleted, Failed, or Terminated states." [ref=e1427]'
        - 'generic "rule: BR-008 When the Listing [[Seller]] differs from the [[Authorization]] Owner, intercompany invoicing is automatically triggered between the [[Authorization]] Owner and the Listing [[Seller]] during billing reconciliation." [ref=e1428]'
        - 'generic "rule: BR-009 notes is a plain-text internal documentation field set by Operations. It is readable by Vendor and Operations. It is not visible to Clients." [ref=e1429]'
        - 'generic "rule: BR-010 A Listing''s name is system-generated and identical to its id. It carries no independent semantic value." [ref=e1430]'
        - 'generic "rule: BR-011 Listing creation is not restricted by the state of the parent [[Product]] or the state of the parent [[Authorization]]." [ref=e1431]'
        - 'generic "rule: BR-012 Sellers are never deleted, only disabled. When a [[Seller]] referenced by a Listing is disabled, the platform prevents new Orders from being placed under that Listing. Existing Agreements and Subscriptions are unaffected." [ref=e1432]'
