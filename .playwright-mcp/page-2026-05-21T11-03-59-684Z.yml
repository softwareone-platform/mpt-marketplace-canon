        - 'generic "rule: BR-001 Units of Measure are platform-level reference objects. They are not scoped to any [[Product]], Vendor, [[Account]], or namespace. The same set is available to all Actors across all Products." [ref=e1788]'
        - 'generic "rule: BR-002 The set of available Units of Measure is fixed and maintained exclusively by Operations. Vendors cannot create, modify, or delete Units of Measure." [ref=e1789]'
        - 'generic "rule: BR-003 A Unit of Measure cannot be deleted regardless of whether it is in use." [ref=e1790]'
        - 'generic "rule: BR-004 A Vendor selects exactly one Unit of Measure when creating a [[Product]] [[Item]]. The Unit of Measure is immutable after [[Item]] creation." [ref=e1791]'
        - 'generic "rule: BR-005 Operations may update the name and description of a Unit of Measure at any time. Updates propagate immediately to all Items referencing that Unit of Measure." [ref=e1792]'
