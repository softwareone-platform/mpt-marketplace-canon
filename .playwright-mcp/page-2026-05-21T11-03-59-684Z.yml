        - 'generic "rule: BR-001 A `DELETE` endpoint exists for Sellers in the API spec (`DELETE /v1/accounts/sellers/{id}`, returns 204). Whether the platform enforces a deletion guard in practice — and what conditions would permit or block deletion — is not confirmed. See SEL-010." [ref=e1377]'
        - 'generic "rule: BR-002 Each Seller has a 1:1 relationship with an instance of SoftwareOne''s ERP system. The `externalId` field is the ERP-side identifier, synced by the ERP Sync process. Uniqueness of `externalId` is not enforced by the platform." [ref=e1378]'
        - 'generic "rule: BR-003 A Seller''s `currencies` array defines the set of currencies in which that Seller may transact. A minimum of one currency is required — enforced by the platform (`minItems: 1` on the `SellerCreate` schema)." [ref=e1379]'
        - 'generic "rule: BR-004 A Seller''s `name` is a freeform string with a minimum length of 1 and a maximum length of 500 characters. The platform enforces no naming convention beyond these constraints." [ref=e1380]'
        - 'generic "rule: BR-005 The `buyers` collection is not returned in Seller API responses. It appears in `$meta.omitted` regardless of whether `select=+buyers` is included in the request — the platform suppresses it unconditionally." [ref=e1381]'
        - 'generic "rule: BR-006 Vendor and Client Actors cannot query Sellers directly via the platform API. Seller identity is surfaced contextually — to Vendors on Authorizations and Listings, and to Clients on Agreements and Orders." [ref=e1382]'
