        - 'generic "rule: BR-001 An Agreement cannot be created independently. It is always co-created by the platform when a Purchase [[Order]] is first persisted. The Agreement and its originating Purchase [[Order]] are created simultaneously under the Client''s token context." [ref=e1832]'
        - 'generic "rule: BR-002 There is no DELETE endpoint on the Agreement. An Agreement can only reach Deleted status when its co-created Draft or Quoted Purchase [[Order]] is deleted by any Actor. No Actor can directly delete an Agreement." [ref=e1833]'
        - 'generic "rule: BR-003 Agreement state transitions are driven entirely by the state transitions of its associated Orders and Subscriptions. No Actor can directly transition an Agreement''s status via a dedicated endpoint." [ref=e1834]'
        - 'generic "rule: BR-004 The Agreement `name` is auto-generated by the platform at creation. The observed pattern is \"[Product Name] for [Client/Licensee Name]\". The name may be updated by the Client at any time after creation." [ref=e1835]'
        - 'generic "rule: BR-005 The Agreement `template` is set by the platform to the [[Template]] of the most recently completed [[Order]] when that [[Order]] completes. The Vendor may update the [[Template]] directly on the Agreement at any time while Active." [ref=e1836]'
        - 'generic "rule: BR-006 When all Subscriptions on an Agreement are Terminated — whether via a Termination [[Order]] or direct Vendor action — the Agreement automatically transitions to Terminated. Assets are unaffected by this transition." [ref=e1837]'
        - 'generic "rule: BR-007 A Failed Agreement is permanently terminal. It cannot be recovered or reactivated. A new Purchase [[Order]] must be created to establish a new Agreement — the platform will co-create a new Agreement automatically." [ref=e1838]'
        - 'generic "rule: BR-008 Lines on the Agreement (accessible via the `/lines` endpoint) represent a flattened list of all Lines across all Subscriptions and Assets on the Agreement. These are referred to as Entitlements in the platform UI and in all internal SoftwareOne communications. The API term is Lines." [ref=e1839]'
        - 'generic "rule: BR-009 The Agreement uses a soft-delete model. Deleted Agreements remain retrievable via the API including in standard list responses. This deviates from Platform Invariant 7." [ref=e1840]'
        - 'generic "rule: BR-010 Agreement-scoped parameters (`scope: \"Agreement\"`) are set during the Purchase [[Order]] and carried over to the Agreement on [[Order]] completion. Both `parameters.ordering` and `parameters.fulfillment` Agreement-scoped values persist on the Agreement. After the Purchase [[Order]] completes, the Client cannot modify any Agreement-scoped parameters. The Vendor can update both `parameters.ordering` and `parameters.fulfillment` directly on the Agreement at any time while Active." [ref=e1841]'
        - 'generic "rule: BR-011 [[Order]]-scoped parameters (`scope: \"[[Order]]\"`) exist only on Orders and are never carried over to the Agreement. Purchase Orders may carry both Agreement-scoped and [[Order]]-scoped parameters. Change, Configuration, and Termination Orders may only carry [[Order]]-scoped parameters — no Agreement-scoped parameter modification is possible via these [[Order]] types." [ref=e1842]'
        - 'generic "rule: BR-012 Parameters with `hidden=true` are suppressed from API responses for the Client Actor on both Orders and Agreements. Hidden parameters are readable by Vendor and Operations in all statuses." [ref=e1843]'
        - 'generic "rule: BR-013 The `billingCurrency` field specifies the currency in which the Client is invoiced. It must be a currency present in the [[Seller]]''s `currencies` array. A forex conversion is applied between the [[Authorization]] currency and the billing currency for invoicing purposes. `billingCurrency` can only be updated by the Client while the Agreement is in Active status." [ref=e1844]'
        - 'generic "rule: BR-014 The `termsAndConditions` array on the Agreement records the T&Cs accepted at the time of the original Purchase [[Order]]. T&Cs from subsequent Change, Configuration, or Termination Orders are not accumulated on the Agreement." [ref=e1845]'
        - 'generic "rule: BR-015 The Agreement `price` object represents the aggregate pricing across all active Subscriptions and Assets by default. The Vendor may manually override the Agreement price when Entitlements are usage-based and carry no fixed price — for example, a pay-as-you-go cloud subscription where the Vendor sets the Agreement price to reflect the most recent invoice value." [ref=e1846]'
        - 'generic "rule: BR-016 Each Actor can update their own `externalIds` field on the Agreement: `externalIds.client` (Client), `externalIds.operations` (Operations), `externalIds.vendor` (Vendor). All are optional." [ref=e1847]'
        - 'generic "rule: BR-017 There can be only one Processing [[Order]] per Agreement at any time — the same constraint that applies at the [[Order]] level prevents concurrent [[Order]] processing. While an [[Order]] is Processing, the Agreement is in Updating or Provisioning status and no further Orders can be placed against it." [ref=e1848]'
