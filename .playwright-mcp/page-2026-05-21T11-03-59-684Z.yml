        - 'generic "rule: BR-001 A [[Terms]] Variant belongs to exactly one [[Terms]] object and cannot be shared across [[Terms]] objects." [ref=e1721]'
        - 'generic "rule: BR-002 A [[Terms]] Variant has a type. Valid types are: Online, File. Type is immutable after creation." [ref=e1722]'
        - 'generic "rule: BR-003 An Online Variant delivers content via an external URL (assetUrl). File attributes (filename, size, contentType, fileId) are not applicable." [ref=e1723]'
        - 'generic "rule: BR-004 A File Variant delivers content as a binary file upload. The file is stored on the platform and referenced by fileId. The assetUrl attribute is not applicable." [ref=e1724]'
        - 'generic "rule: BR-005 A [[Terms]] Variant requires a language code on creation. For Online type, the language code may be null to indicate the Variant covers multiple languages. For File type, a specific language code is always required — multi-language is not supported for File Variants." [ref=e1725]'
        - 'generic "rule: BR-006 Variant state is fully independent of the parent [[Terms]] state. Publishing, unpublishing, or deleting a [[Terms]] object does not automatically affect its Variants'' states, and Variant state changes do not affect the parent [[Terms]] state." [ref=e1726]'
        - 'generic "rule: BR-007 Only Published Variants are shown to the Client when the parent [[Terms]] is presented for acceptance." [ref=e1727]'
        - 'generic "rule: BR-008 Variant creation, modification, and deletion are not restricted by the state of the parent [[Terms]] or the parent [[Product]]." [ref=e1728]'
        - 'generic "rule: BR-009 Only Draft Variants may be deleted by the Vendor. Published, Pending, and Unpublished Variants cannot be deleted." [ref=e1729]'
