        - 'generic "rule: BR-001 A Pricing Policy is scoped to exactly one Client. It cannot apply to multiple Clients or to all Clients." [ref=e1529]'
        - 'generic "rule: BR-002 A Pricing Policy defines a yield cap — the maximum markup or margin that may be applied to matching Orders. The cap is always stored as a markup value. If a margin is specified in the UI, it is converted to a markup before storage. Both markup and margin are returned on the API response, computed from each other to 10 decimal places." [ref=e1530]'
        - 'generic "rule: BR-003 A Pricing Policy has an eligibility object with client and partner boolean flags. These control which eligibility types the cap applies to." [ref=e1531]'
        - 'generic "rule: BR-004 A Pricing Policy may be scoped to specific Products, or may apply to all Products for the scoped Client. When no Products are specified (products array is null or absent), the policy applies to all Products." [ref=e1532]'
        - 'generic "rule: BR-005 A Pricing Policy may have one or more Attachments — supporting documents that provide evidence or approval for the policy (e.g. a signed contract or approval record). Attachments are child objects of the Pricing Policy." [ref=e1533]'
        - 'generic "rule: BR-006 The yield cap is observed during [[Order]] creation in the Commerce namespace. The platform will not permit a markup or margin above the cap for Orders that match the policy''s Client, eligibility, and [[Product]] scope." [ref=e1534]'
        - 'generic "rule: BR-007 A Pricing Policy only enforces its yield cap when in Active state. Policies in None or Inactive state have no effect on [[Order]] pricing." [ref=e1535]'
        - 'generic "rule: BR-008 notes is an optional internal plain-text documentation field readable and writable by Operations only." [ref=e1536]'
        - 'generic "rule: BR-009 externalIds.operations is an optional Operations-set external identifier for the Pricing Policy, used to correlate with external systems." [ref=e1537]'
