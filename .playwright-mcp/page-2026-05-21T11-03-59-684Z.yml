        - 'generic "rule: BR-001 A [[Price List]] [[Item]] is created automatically for every [[Product]] [[Item]] when a [[Price List]] is created. [[Price List]] Items are never created manually." [ref=e1457]'
        - 'generic "rule: BR-002 When a new [[Product]] [[Item]] is added to a [[Product]], a [[Price List]] [[Item]] in Draft status is automatically created in every [[Price List]] under that [[Product]]." [ref=e1458]'
        - 'generic "rule: BR-003 [[Price List]] Items cannot be deleted." [ref=e1459]'
        - 'generic "rule: BR-004 The transition from Draft to ForSale or Private is irreversible. A [[Price List]] [[Item]] cannot return to Draft." [ref=e1460]'
        - 'generic "rule: BR-005 A ForSale [[Price List]] [[Item]] is available for new purchases and change orders, subject to the corresponding [[Product]] [[Item]] being Published and the [[Price List]] being referenced by an active [[Listing]]." [ref=e1461]'
        - 'generic "rule: BR-006 A Private [[Price List]] [[Item]] is available for change orders only. It is not available for new purchases." [ref=e1462]'
        - 'generic "rule: BR-007 A Draft [[Price List]] [[Item]] is not available for purchase or change orders regardless of [[Product]] [[Item]] state." [ref=e1463]'
        - 'generic "rule: BR-008 If a [[Product]] [[Item]] is Unpublished, it is unavailable for both new purchases and change orders regardless of [[Price List]] [[Item]] status. [[Product]] [[Item]] Unpublished overrides [[Price List]] [[Item]] ForSale or Private." [ref=e1464]'
        - 'generic "rule: BR-009 unitLP and unitPP are independently optional. Each has a \"Supported\" flag. When not supported, the field is absent from API responses. To clear a supported field and mark it unsupported, write null. unitLP can be unsupported while unitPP is supported, and vice versa." [ref=e1465]'
        - 'generic "rule: BR-010 Whether unitLP and unitPP are present depends on the Supported flag, not on terms.model. For usage items, unitLP and unitPP may be set to zero (0) or absent depending on whether the Vendor''s pricing model is known at time of sale. For items where pricing is not known until billing time, pricing fields are absent and the Vendor provides pricing via a Billing: Journal entry at billing time." [ref=e1466]'
        - 'generic "rule: BR-011 markup is the stored source of truth for SoftwareOne''s margin on a [[Price List]] [[Item]]. unitSP is never stored — it is computed as unitPP * (1 + markup)." [ref=e1467]'
        - 'generic "rule: BR-012 When a Vendor sets unitLP and unitPP, the platform automatically sets markup such that unitSP = unitLP. The default sales price to the Client is therefore the Vendor''s RRP. Since unitPP is typically below unitLP, SoftwareOne retains margin at this default. Operations may subsequently adjust markup. When unitLP is not supported, the platform uses defaultMarkup from the parent [[Price List]] as the markup for this item instead." [ref=e1468]'
        - 'generic "rule: BR-013 markup, margin, unitSP, and all derived SP fields (SPxM, SPxY, SPx1) are not present in API responses when using a Vendor or Client token. These fields are visible to Operations only." [ref=e1469]'
        - 'generic "rule: BR-014 All period-normalised pricing fields are computed from their respective unit prices and the terms.period of the associated [[Product]] [[Item]]. They are never stored. The applicable fields depend on terms.period: xM and xY variants for 1m, 1y, and 3y items; x1 variants for one-time items." [ref=e1470]'
        - 'generic "rule: BR-015 All unit prices (unitLP, unitPP, unitSP) represent the price for one terms.period duration of the associated [[Product]] [[Item]] — not an assumed annual price." [ref=e1471]'
        - 'generic "rule: BR-016 info.visible controls whether info.description is rendered and shown to the Client. When info.visible = false, the description is not shown regardless of whether it is populated. info.visible applies to info.description only — it has no effect on [[Item]] availability, pricing visibility, or status." [ref=e1472]'
        - 'generic "rule: BR-017 info.description has a maximum length of 400 characters including all markdown/html tags." [ref=e1473]'
        - 'generic "rule: BR-018 When info.visible = true and info.description is populated, a Client sees a circle-i icon next to the [[Item]] in the [[Price List]]. Hovering over the icon reveals the description. Applies to both ForSale items (new purchase context) and Private items (change order item selection context). Not shown for Draft items." [ref=e1474]'
