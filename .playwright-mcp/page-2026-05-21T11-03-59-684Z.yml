        - 'generic "term: Is Default" [ref=e1677]'
        - 'generic "term: Content" [ref=e1678]'
        - 'generic "term: Parameter Fields" [ref=e1679]'
        - 'generic "term: Revision" [ref=e1680]'
        - 'generic "term: External IDs" [ref=e1681]'
        - 'generic "rule: BR-001 A Template belongs to exactly one [[Product]] and cannot be shared across Products." [ref=e1682]'
        - 'generic "rule: BR-002 A Template has a type. Valid types are: [[Asset]], [[Subscription]], OrderProcessing, OrderQuerying, OrderCompleted." [ref=e1683]'
        - 'generic "rule: BR-003 A Template can only be applied to an object whose type and state match the Template type: [[Asset]] (any state), [[Subscription]] (any state), OrderProcessing ([[Order]] in Processing state only), OrderQuerying ([[Order]] in Querying state only), OrderCompleted ([[Order]] in Completed state only)." [ref=e1684]'
        - 'generic "rule: BR-004 For each of the three [[Order]] Template types (OrderProcessing, OrderQuerying, OrderCompleted), exactly one Template of that type must be marked as Default. Default Templates cannot be deleted. To delete a Default Template, the Vendor must first demote it by marking another Template of the same type as Default." [ref=e1685]'
        - 'generic "rule: BR-005 If a Vendor marks a Template as Default and another Template of the same type is already marked as Default, the existing Default is automatically demoted." [ref=e1686]'
        - 'generic "rule: BR-006 [[Asset]] and [[Subscription]] Template types have no Default mechanism and are never applied automatically by the platform. The Vendor is solely responsible for explicitly applying their chosen Template." [ref=e1687]'
        - 'generic "rule: BR-007 When an [[Order]] changes state and no Template is specified, the Default Template for the target state is applied automatically." [ref=e1688]'
        - 'generic "rule: BR-008 When a Vendor moves an [[Order]] to Querying state, they may specify which OrderQuerying Template to apply." [ref=e1689]'
        - 'generic "rule: BR-009 When a Vendor moves an [[Order]] to Completed state, they may specify which OrderCompleted Template to apply." [ref=e1690]'
        - 'generic "rule: BR-010 When an [[Order]] moves from Querying to Processing (initiated by the Client), the Default OrderProcessing Template is applied. The Client cannot specify a Template." [ref=e1691]'
        - 'generic "rule: BR-011 When an [[Order]] reaches Completed state, the OrderCompleted Template on that [[Order]] is referenced by ID on the resulting Active [[Agreement]]. The [[Agreement]] holds a reference, not a copy — updates to the Template content under the [[Product]] definition propagate to the [[Agreement]]." [ref=e1692]'
        - 'generic "rule: BR-012 The Vendor can change the Template on an [[Order]] at any time while the [[Order]] is in Processing or Querying state." [ref=e1693]'
        - 'generic "rule: BR-013 The Vendor can change the Template on an [[Agreement]] at any time while the [[Agreement]] is in Active state." [ref=e1694]'
        - 'generic "rule: BR-014 The Vendor can change the Template on an [[Asset]] at any time while the [[Asset]] is in Active state." [ref=e1695]'
        - 'generic "rule: BR-015 The Vendor can change the Template on a [[Subscription]] at any time while the [[Subscription]] is in Active state." [ref=e1696]'
        - 'generic "rule: BR-016 A non-Default Template may be deleted by the Vendor even if it is currently applied to an active [[Order]], [[Agreement]], [[Asset]], or [[Subscription]]. In this case, the Template will fail to render on those objects. Default Templates cannot be deleted." [ref=e1697]'
        - 'generic "rule: BR-017 Templates have a maximum length of 4,000 characters, including all markdown/html tags." [ref=e1698]'
        - 'generic "rule: BR-018 Templates may include parameter value substitution fields in the format {{ [[PAR]]-XXXX-XXXX-XXXX }}, where the ID references a [[Parameter]] defined under the same [[Product]]. At render time, the token is replaced with the current value of that [[Parameter]] on the target object. Only parameter values are supported — object properties (e.g. [[Order]] or [[Agreement]] fields) cannot be substituted." [ref=e1699]'
        - 'generic "rule: BR-019 There can exist more than one Template of the same type under a single [[Product]]." [ref=e1700]'
        - 'generic "rule: BR-020 When a Template is rendered and a parameter substitution field references a parameter with a null or empty value, the field is rendered as a zero-length string." [ref=e1701]'
        - 'generic "rule: BR-021 Template creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1702]'
