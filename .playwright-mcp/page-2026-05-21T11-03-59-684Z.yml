        - 'generic "rule: BR-001 An Authorization records the commercial relationship between exactly one Accounts: [[Seller]] (the Authorization Owner), one Vendor, one Catalog: [[Product]], and one currency. This four-part tuple is the identity of the Authorization." [ref=e1399]'
        - 'generic "rule: BR-002 Multiple Authorizations may exist with the same [[Seller]], Vendor, [[Product]], and currency. The platform does not enforce uniqueness on this tuple. Duplicate Authorizations may represent valid commercial configurations or may represent misconfiguration — the Vendor and Operations are responsible for managing this." [ref=e1400]'
        - 'generic "rule: BR-003 An Authorization is a precondition for creating a [[Listing]]. A [[Listing]] cannot exist without a parent Authorization." [ref=e1401]'
        - 'generic "rule: BR-004 An Authorization may be referenced by more than one [[Listing]]." [ref=e1402]'
        - 'generic "rule: BR-005 journal.firstInvoiceDate and journal.frequency are set by Operations only. These fields record the billing cadence established under the commercial relationship. No platform behaviour is automatically triggered by these values — they serve as a reference for billing operations." [ref=e1403]'
        - 'generic "rule: BR-006 An Authorization can only be deleted if it has no Listings. The presence of any [[Listing]] — regardless of that [[Listing]]''s state or whether it has downstream active Agreements — blocks deletion." [ref=e1404]'
        - 'generic "rule: BR-007 settings is an optional schemaless JSON blob. It must be valid JSON but is not validated against any schema. It may be read and written by Vendor and Operations at any time. It has a maximum size of 4,000 characters." [ref=e1405]'
        - 'generic "rule: BR-008 notes is a plain-text internal documentation field set by Operations. It is readable by Vendor and Operations. It is not visible to Clients." [ref=e1406]'
        - 'generic "rule: BR-009 eligibility controls which Client types may transact under this Authorization. client and partner are independent boolean flags set by Operations based on contract terms with the Vendor." [ref=e1407]'
        - 'generic "rule: BR-010 externalIds.operations is an Operations-set external identifier for the Authorization, used to correlate with external systems. There is no vendor external ID namespace on Authorization." [ref=e1408]'
        - 'generic "rule: BR-011 Authorization creation, modification, and deletion are not restricted by the state of the parent [[Product]]." [ref=e1409]'
        - 'generic "entity: Listing" [ref=e1410]'
        - 'generic "term: name" [ref=e1411]'
        - 'generic "term: primary" [ref=e1412]'
        - 'generic "term: eligibility.client" [ref=e1413]'
        - 'generic "term: eligibility.partner" [ref=e1414]'
