<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canon Graph</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0d1117;
        color: #c9d1d9;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #app { width: 100vw; height: 100vh; }
      svg { display: block; cursor: grab; }
      svg:active { cursor: grabbing; }
      .node-label {
        font-size: 10px;
        fill: #c9d1d9;
        pointer-events: none;
        paint-order: stroke;
        stroke: #0d1117;
        stroke-width: 3px;
        stroke-linejoin: round;
      }
      .link { stroke-opacity: 0.4; }
      .link.owns { stroke-opacity: 0.15; }

      .legend {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(20, 24, 32, 0.88);
        padding: 10px 12px;
        border-radius: 6px;
        font-size: 12px;
        max-width: 240px;
        backdrop-filter: blur(4px);
      }
      .legend h3 {
        margin: 0 0 6px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #8b949e;
      }
      .legend h3:not(:first-child) { margin-top: 10px; }
      .legend ul { list-style: none; padding: 0; margin: 0; }
      .legend li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
      }
      .legend .swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex-shrink: 0;
      }
      .legend .count {
        margin-left: auto;
        color: #8b949e;
        font-variant-numeric: tabular-nums;
      }

      .stats {
        position: fixed;
        bottom: 12px;
        left: 12px;
        background: rgba(20, 24, 32, 0.88);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 11px;
        color: #8b949e;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
